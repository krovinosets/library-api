          maximum: 100
        offset:
          type: integer
          minimum: 0
          maximum: 1000000
        total:
          type: integer
          minimum: 0
          description: Число записей после фильтрации до пагинации.
        has_more:
          type: boolean
          description: offset + фактическое количество data < total.
      required:
