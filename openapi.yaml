  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: UUID ресурса. Некорректный синтаксис — 400, отсутствующий ресурс — 404.
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      description: Размер страницы, по умолчанию 20; от 1 до 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      description: Количество пропущенных записей после фильтрации и сортировки.
      schema:
        type: integer
        minimum: 0
        maximum: 1000000
        default: 0
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Обязательный UUID, без кавычек, уникальный для логического создания выдачи. Точная политика scope,
        fingerprint, replay, concurrency и TTL описана в POST /loans.
      schema:
        type: string
        format: uuid
      example: 55555555-5555-4555-8555-555555555555
  headers:
    RequestId:
      description: ID обработки запроса. При replay воспроизводится исходное значение.
      schema:
        type: string
        format: uuid
    Location:
      description: Относительный URI созданного ресурса с префиксом /v1/.
      schema:
        type: string
        format: uri-reference
    RetryAfter:
      description: Только для issue=idempotency_in_progress; 1 секунда до следующей попытки. Не задаёт максимальное
        время выполнения исходного запроса.
      schema:
        type: integer
        minimum: 1
      example: 1
  responses:
    InvalidRequest:
      description: Некорректный JSON, повторяющиеся JSON-ключи, неверные/неизвестные query-параметры, некорректный
        UUID пути или отсутствующий/некорректный Idempotency-Key. Код INVALID_REQUEST.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            InvalidRequest:
              $ref: '#/components/examples/InvalidRequest'
    NotFound:
      description: 'Ресурс не существует или логически удалён. При создании выдачи также: книга или читатель не
        найдены. Код NOT_FOUND.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            NotFound:
              $ref: '#/components/examples/NotFound'
    ValidationError:
      description: Валидный JSON нарушает схему запроса или ограничения значений; неизвестные поля, неверная контрольная
        сумма ISBN и due_date не в будущем. Код VALIDATION_ERROR.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            ValidationError:
              $ref: '#/components/examples/ValidationError'
            UnknownField:
              $ref: '#/components/examples/UnknownField'
            InvalidDueDate:
              $ref: '#/components/examples/InvalidDueDate'
            InvalidIsbn:
              $ref: '#/components/examples/InvalidIsbn'
    Conflict:
      description: Конфликт уникальности, состояния или идемпотентности. CONFLICT — дубликат ISBN/email либо конкурентный
        повтор в обработке; BUSINESS_RULE_VIOLATION — недоступный экземпляр, лимит пяти выдач, активные выдачи при
        удалении, уменьшение фонда ниже числа выдач; IDEMPOTENCY_MISMATCH — другое тело с тем же ключом. Конкретные
        применимые причины описаны у операции.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            DuplicateIsbn:
              $ref: '#/components/examples/DuplicateIsbn'
            DuplicateEmail:
              $ref: '#/components/examples/DuplicateEmail'
            NoCopies:
              $ref: '#/components/examples/NoCopies'
            LoanLimit:
              $ref: '#/components/examples/LoanLimit'
            ActiveLoans:
              $ref: '#/components/examples/ActiveLoans'
            CopiesBelowActive:
              $ref: '#/components/examples/CopiesBelowActive'
            IdempotencyMismatch:
              $ref: '#/components/examples/IdempotencyMismatch'
            IdempotencyInProgress:
              $ref: '#/components/examples/IdempotencyInProgress'
    UnsupportedMediaType:
      description: 'Тело запроса должно иметь Content-Type: application/json. Код INVALID_REQUEST.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  examples:
    InvalidRequest:
      summary: Некорректный параметр сортировки
      value:
        error:
          code: INVALID_REQUEST
          message: Недопустимое значение sort.
          details:
          - field: sort
            issue: invalid_sort
            message: Недопустимое значение sort.
          request_id: 44444444-4444-4444-8444-444444444444
    NotFound:
      summary: Ресурс не найден
      value:
        error:
          code: NOT_FOUND
          message: Книга не найдена.
          details:
          - field: book_id
            issue: not_found
            message: Книга не найдена.
          request_id: 44444444-4444-4444-8444-444444444444
    InvalidDueDate:
      summary: Дата новой выдачи не в будущем
      value:
        error:
          code: VALIDATION_ERROR
          message: due_date должна быть позже текущей даты UTC.
          details:
          - field: due_date
            issue: future_date_required
            message: due_date должна быть позже текущей даты UTC.
          request_id: 44444444-4444-4444-8444-444444444444
    UnknownField:
      summary: Серверное поле передано клиентом
      value:
        error:
          code: VALIDATION_ERROR
          message: Поле available_copies запрещено в запросе.
          details:
          - field: available_copies
            issue: additional_property
            message: Поле available_copies запрещено в запросе.
          request_id: 44444444-4444-4444-8444-444444444444
    InvalidIsbn:
      summary: Ошибка контрольной суммы ISBN-13
      value:
        error:
          code: VALIDATION_ERROR
          message: Неверная контрольная сумма ISBN-13.
          details:
          - field: isbn
            issue: invalid_checksum
            message: Неверная контрольная сумма ISBN-13.
          request_id: 44444444-4444-4444-8444-444444444444
    ValidationError:
      summary: Пустое название
      value:
        error:
          code: VALIDATION_ERROR
          message: Название не может быть пустым.
          details:
          - field: title
            issue: min_length
            message: Название не может быть пустым.
          request_id: 44444444-4444-4444-8444-444444444444
    NoCopies:
      summary: Все экземпляры выданы
      value:
        error:
          code: BUSINESS_RULE_VIOLATION
          message: Нет доступных экземпляров.
          details:
          - field: book_id
            issue: no_available_copies
            message: Нет доступных экземпляров.
          request_id: 44444444-4444-4444-8444-444444444444
    LoanLimit:
      summary: У читателя уже пять активных выдач
      value:
        error:
          code: BUSINESS_RULE_VIOLATION
          message: Допускается не более пяти активных выдач.
          details:
          - field: reader_id
            issue: active_loans_limit
            message: Допускается не более пяти активных выдач.
          request_id: 44444444-4444-4444-8444-444444444444
    ActiveLoans:
      summary: Удаление заблокировано активными выдачами
      value:
        error:
          code: BUSINESS_RULE_VIOLATION
          message: Нельзя удалить ресурс с активными выдачами.
          details:
          - field: null
            issue: active_loans_exist
            message: Нельзя удалить ресурс с активными выдачами.
          request_id: 44444444-4444-4444-8444-444444444444
    CopiesBelowActive:
      summary: Нельзя уменьшить фонд ниже числа выдач
      value:
        error:
          code: BUSINESS_RULE_VIOLATION
          message: total_copies меньше числа активных выдач.
          details:
          - field: total_copies
            issue: copies_below_active_loans
            message: total_copies меньше числа активных выдач.
          request_id: 44444444-4444-4444-8444-444444444444
    DuplicateIsbn:
      summary: ISBN уже используется
      value:
        error:
          code: CONFLICT
          message: Книга с таким ISBN уже существует.
          details:
          - field: isbn
            issue: duplicate_isbn
            message: Книга с таким ISBN уже существует.
          request_id: 44444444-4444-4444-8444-444444444444
    DuplicateEmail:
      summary: Email уже используется
      value:
        error:
          code: CONFLICT
          message: Читатель с таким email уже существует.
          details:
          - field: email
            issue: duplicate_email
            message: Читатель с таким email уже существует.
          request_id: 44444444-4444-4444-8444-444444444444
    IdempotencyMismatch:
      summary: Ключ повторно использован с другим телом
      value:
        error:
          code: IDEMPOTENCY_MISMATCH
          message: Этот Idempotency-Key уже связан с другим телом запроса.
          details:
          - field: Idempotency-Key
            issue: payload_mismatch
            message: Этот Idempotency-Key уже связан с другим телом запроса.
          request_id: 44444444-4444-4444-8444-444444444444
    IdempotencyInProgress:
      summary: Первый запрос с ключом ещё обрабатывается
      value:
        error:
          code: CONFLICT
          message: Запрос с этим ключом ещё выполняется. Повторите позже.
          details:
          - field: Idempotency-Key
            issue: idempotency_in_progress
            message: Запрос с этим ключом ещё выполняется. Повторите позже.
          request_id: 44444444-4444-4444-8444-444444444444
    BookCreated:
      summary: Созданная книга
      value: *id004
    ReaderCreated:
      summary: Созданный читатель
      value: *id005
    LoanCreated:
      summary: Новая активная выдача
      value: *id006
    LoanReturned:
      summary: Выдача после возврата
      value: *id007
