              - NOT_FOUND
              - VALIDATION_ERROR
              - CONFLICT
              - BUSINESS_RULE_VIOLATION
              - IDEMPOTENCY_MISMATCH
            message:
              type: string
              minLength: 1
            details:
              type: array
              items:
